services:
  db:
    image: postgres:16-alpine
    container_name: sushi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sushi}
      POSTGRES_USER: ${POSTGRES_USER:-sushi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sushi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sushi} -d ${POSTGRES_DB:-sushi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sushi_net

  api:
    build:
      context: ./backend
    container_name: sushi_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sushi}:${POSTGRES_PASSWORD:-sushi}@db:5432/${POSTGRES_DB:-sushi}
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - sushi_net

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    container_name: sushi_web
    restart: unless-stopped
    environment:
      # Server-side fetches use the internal Docker network.
      INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    depends_on:
      - api
    networks:
      - sushi_net

  nginx:
    image: nginx:1.27-alpine
    container_name: sushi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/var/www/media:ro
      - static_data:/var/www/static:ro
    depends_on:
      - api
      - web
    networks:
      - sushi_net

volumes:
  postgres_data:
  media_data:
  static_data:

networks:
  sushi_net:
    driver: bridge
